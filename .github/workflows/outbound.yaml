# ══════════════════════════════════════════════════════════════════════════════
# OUTBOUND SNIPER — GitHub Actions Workflow
# ══════════════════════════════════════════════════════════════════════════════
#
# SCHEDULE (all UTC):
#   Mon 04:30  → source    Fresh leads via Serper + LinkedIn, append to CSV
#   Mon 05:00  → draft     Gemini drafts emails for all un-drafted Pending rows
#   Mon 06:30  → dispatch  Send up to 5 (India/UK morning window)
#   Tue 06:30  → dispatch  Send up to 5
#   Wed 06:30  → dispatch  Send up to 5
#   Thu 06:30  → dispatch  Send up to 5
#                          ─────────────────────────
#                          Total cap: 20/week (config controlled)
#
# Draft is INDEPENDENT of source — it can also be triggered manually at any time
# to draft emails for any Pending rows that were sourced in previous runs.
#
# HOW DISPATCH WORKS (no human approval needed):
#   Bot sources leads → drafts emails → dispatches automatically.
#   All sent emails are logged in state/dispatch_log.jsonl.
#   pipeline.csv and pipeline.xlsx update after every run — view anytime.
#
# REQUIRED GITHUB SECRETS  (Settings → Secrets → Actions → New repository secret):
#   SERPER_API_KEY       serper.dev API key (free: 2500 searches/month)
#   GROQ_API_KEY          console.groq.com API key (free tier) — module_c actually
#                          calls Groq (openai/gpt-oss-120b), not Gemini, despite
#                          older references to "Gemini" elsewhere in this repo.
#   SENDER_EMAIL         tanmay.kaper1401@gmail.com
#   GMAIL_APP_PASSWORD   16-char App Password (myaccount.google.com → Security → App Passwords)
#
# RECOMMENDED — email waterfall (all have free tiers; without these, every
# lead falls back to unverified pattern-guessing, which is what "sourcing
# results in nothing but pattern inference" usually means in practice):
#   HUNTER_API_KEY        hunter.io          — 25 verified lookups/mo free
#   PROSPEO_API_KEY       prospeo.io         — 75 lookups/mo free, strong India coverage
#   ANYMAILFINDER_KEY     anymailfinder.com  — 90 lookups/mo free, good for .in domains
#   SNOV_CLIENT_ID / SNOV_CLIENT_SECRET   snov.io — 50 credits/mo free
#   APOLLO_API_KEY         apollo.io         — 600 credits/mo free
#
# LEFT UNSET ON PURPOSE — do not set these on your primary/daily LinkedIn
# account. See modules/module_a_sourcing.py header + README "LinkedIn
# sourcing" section. ENABLE_LINKEDIN_AUTOMATION defaults to false; the
# pipeline works fully without it via state/manual_leads_inbox.csv instead.
#   LINKEDIN_USERNAME, LINKEDIN_PASSWORD, ENABLE_LINKEDIN_AUTOMATION
#
# OPTIONAL SECRETS (have defaults):
#   OUTREACH_MODE          internship (default) | job
#   WEEKLY_TARGET           25 (leads to source per week)
#   WEEKLY_CAP              20 (max emails sent per week)
#   MAX_PER_RUN             5  (max per dispatch run)
#   SCORE_THRESHOLD         55 (minimum lead quality score 0-100)
#   REQUIRE_VERIFIED_EMAIL  false — set true once waterfall keys above are
#                            configured, to block sends to pattern-guessed
#                            (unverified) addresses entirely.
# ══════════════════════════════════════════════════════════════════════════════

name: Outbound Sniper

on:
  schedule:
    - cron: "30 4 * * 1"   # Monday 04:30 UTC → source
    - cron: "0 5 * * 1"    # Monday 05:00 UTC → draft
    
    # GLOBAL DISPATCH SWEEPER (Mon–Thu)
    # 05:00 UTC = 10:30 AM IST (Catches India morning)
    # 10:00 UTC = 3:30 PM IST (India afternoon) & 10:00 AM UK (UK morning)
    # 15:00 UTC = 3:00 PM UK (UK afternoon) & 10:00 AM US East (NY morning)
    # 19:00 UTC = 2:00 PM US East (NY afternoon) & 11:00 AM US West (SF morning)
    - cron: "0 5,10,15,19 * * 1-4"

  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline stage to run"
        required: true
        default: "draft"
        type: choice
        options: [source, manual_intake, draft, dispatch]
      dry_run:
        description: "Dry run — log but do not send emails"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      force_window:
        description: "Force dispatch — skip timezone window check"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      outreach_mode:
        description: "Override outreach mode for this run only"
        required: false
        default: "internship"
        type: choice
        options: [internship, job]

# Prevent concurrent runs stomping each other's CSV commits
concurrency:
  group: outbound-pipeline
  cancel-in-progress: false

jobs:

  # ════════════════════════════════════════════════════════════════════════
  # SOURCE  — Monday 04:30 UTC
  # ════════════════════════════════════════════════════════════════════════
  source:
    name: "🔍 Source Leads"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 4 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'source')

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sourcing pipeline
        working-directory: modules
        env:
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          LINKEDIN_USERNAME: ${{ secrets.LINKEDIN_USERNAME }}
          LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
          ENABLE_LINKEDIN_AUTOMATION: ${{ secrets.ENABLE_LINKEDIN_AUTOMATION || 'false' }}
          OUTREACH_MODE:     ${{ secrets.OUTREACH_MODE || 'internship' }}
          WEEKLY_TARGET:     ${{ secrets.WEEKLY_TARGET || '35' }}
          SCORE_THRESHOLD:   ${{ secrets.SCORE_THRESHOLD || '55' }}
          HUNTER_API_KEY:    ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY:   ${{ secrets.PROSPEO_API_KEY }}
          ANYMAILFINDER_KEY: ${{ secrets.ANYMAILFINDER_KEY }}
          SNOV_CLIENT_ID:    ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          ACTION:            source
        run: python orchestrator.py

      - name: Commit pipeline.csv + pipeline.xlsx
        run: |
          git config user.name  "outbound-bot[actions]"
          git config user.email "outbound-bot@users.noreply.github.com"
          git add state/pipeline.csv state/pipeline.xlsx
          git diff --staged --quiet || git commit -m "bot: source run $(date -u +'%Y-%m-%d')"
          git push

  # ════════════════════════════════════════════════════════════════════════
  # MANUAL INTAKE — run on demand after you've pasted rows into
  # state/manual_leads_inbox.csv from a manual LinkedIn Premium / Sales
  # Navigator browsing session. No LinkedIn automation — see
  # modules/module_a_manual_intake.py.
  # ════════════════════════════════════════════════════════════════════════
  manual_intake:
    name: "🖐️ Manual LinkedIn Intake"
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'manual_intake'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run manual intake pipeline
        working-directory: modules
        env:
          SERPER_API_KEY:    ${{ secrets.SERPER_API_KEY }}
          HUNTER_API_KEY:    ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY:   ${{ secrets.PROSPEO_API_KEY }}
          ANYMAILFINDER_KEY: ${{ secrets.ANYMAILFINDER_KEY }}
          SNOV_CLIENT_ID:    ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
          APOLLO_API_KEY:    ${{ secrets.APOLLO_API_KEY }}
          OUTREACH_MODE:     ${{ github.event.inputs.outreach_mode || secrets.OUTREACH_MODE || 'internship' }}
          ACTION:            manual_intake
        run: python orchestrator.py

      - name: Commit pipeline + cleared inbox rows
        run: |
          git config user.name  "outbound-bot[actions]"
          git config user.email "outbound-bot@users.noreply.github.com"
          git add state/pipeline.csv state/pipeline.xlsx state/manual_leads_inbox.csv
          git diff --staged --quiet || git commit -m "bot: manual intake $(date -u +'%Y-%m-%d')"
          git push

  # ════════════════════════════════════════════════════════════════════════
  # DRAFT  — Monday 05:00 UTC  (INDEPENDENT — no 'needs: source')
  # Can also be triggered manually at any time to draft for any un-drafted rows
  # ════════════════════════════════════════════════════════════════════════
  draft:
    name: "✍️ Draft Emails (Gemini)"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 5 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'draft')

    permissions:
      contents: write

    steps:
      - name: Checkout (pull latest — source may have just pushed)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Draft emails via Gemini
        working-directory: modules
        env:
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          OUTREACH_MODE:   ${{ github.event.inputs.outreach_mode || secrets.OUTREACH_MODE || 'internship' }}
          ACTION:          draft
        run: python orchestrator.py

      - name: Commit drafted CSV + Excel
        run: |
          git config user.name  "outbound-bot[actions]"
          git config user.email "outbound-bot@users.noreply.github.com"
          git add state/pipeline.csv state/pipeline.xlsx
          git diff --staged --quiet || git commit -m "bot: email drafts $(date -u +'%Y-%m-%d')"
          git push

  # ════════════════════════════════════════════════════════════════════════
  # DISPATCH  — Mon/Tue/Wed/Thu 06:30 UTC
  # Reads Pending rows with drafts, checks timezone windows, sends via Gmail
  # ════════════════════════════════════════════════════════════════════════
  dispatch:
    name: "🚀 Dispatch Emails"
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 5,10,15,19 * * 1-4') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'dispatch')

    permissions:
      contents: write

    steps:
      - name: Checkout (pull latest state)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dispatch emails
        working-directory: modules
        env:
          SENDER_EMAIL:       ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          OUTREACH_MODE:      ${{ github.event.inputs.outreach_mode || secrets.OUTREACH_MODE || 'internship' }}
          MAX_PER_RUN:        ${{ secrets.MAX_PER_RUN || '10' }}
          WEEKLY_CAP:         ${{ secrets.WEEKLY_CAP || '40' }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_WINDOW:       ${{ github.event.inputs.force_window || 'false' }}
          ACTION:             dispatch
        run: python orchestrator.py

      - name: Commit state (CSV, Excel, logs, weekly count)
        run: |
          git config user.name  "outbound-bot[actions]"
          git config user.email "outbound-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "bot: dispatch $(date -u +'%Y-%m-%dT%H:%M')"
          git push
